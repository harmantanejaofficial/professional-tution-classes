<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Tuition Classes</title>
    <!-- Your existing styles plus login styles -->
    <style>
        /* Your main website styles */
        body { font-family: Arial, sans-serif; background: #f4f4f9; }
        
        /* Login box styles */
        .box { background: white; padding: 20px; margin: 20px auto; border-radius: 8px; width: 100%; max-width: 350px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 10px; margin: 6px 0 14px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #DC2626; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #B91C1C; }
    </style>
</head>
<body>

    <!-- Your existing main website navigation and hero sections go here -->

    <!-- Student Login Form Section -->
    <div class="box">
        <h3>Student Login</h3>
        <input type="text" id="loginId" placeholder="Student ID (e.g., PTC101)">
        <input type="password" id="loginPass" placeholder="Password">
        <button onclick="loginStudent()">Login</button>
        <p id="msg" style="color: #DC2626; font-size: 0.85rem; margin: 0;"></p>
    </div>

    <!-- Generated Dashboard Section -->
    <div id="dashboard" class="box" style="display:none; background:#F0FDF4; border: 1px solid #86EFAC;">
        <h3>Student Dashboard</h3>
        <p><strong>Name:</strong> <span id="dName"></span></p>
        <p><strong>Student ID:</strong> <span id="dId"></span></p>
        <p><strong>Tuition Fees:</strong> ₹<span id="dFees"></span></p>
        <button onclick="logout()" style="background:#64748B;">Logout</button>
    </div>

    <!-- Your existing footer -->

    <!-- Script containing database and login logic -->
    <script>
        const studentsDatabase = [
            { id: "1", pass: "student123", name: "Aarav Sharma", fees: "1500pending" },
            { id: "2", pass: "student123", name: "Priya Verma", fees: "2000pending" },
            { id: "3", pass: "student123", name: "Rahul Gupta", fees: "1800" }
        ];

        function loginStudent() {
            const idInput = document.getElementById('loginId').value.trim();
            const passInput = document.getElementById('loginPass').value.trim();
            const msg = document.getElementById('msg');

            const student = studentsDatabase.find(s => s.id === idInput && s.pass === passInput);

            if (student) {
                document.getElementById('dName').innerText = student.name;
                document.getElementById('dId').innerText = student.id;
                document.getElementById('dFees').innerText = student.fees;
                document.getElementById('dashboard').style.display = 'block';
                msg.innerText = '';
            } else {
                msg.innerText = 'Invalid Student ID or Password.';
                document.getElementById('dashboard').style.display = 'none';
            }
        }

        function logout() {
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('loginId').value = '';
            document.getElementById('loginPass').value = '';
        }
    </script>
</body>
</html>
